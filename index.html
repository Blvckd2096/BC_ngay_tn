<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Báo Cáo Nước">
<title>Báo Cáo Công Việc – Tổ Nước</title>
<style>
  :root[data-theme="light"] {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-sub: #f8fafc;
    --border: #cbd5e1;
    --text: #0f172a;
    --text-muted: #64748b;
    --primary: #2563eb;
    --primary-soft: rgba(37, 99, 235, 0.1);
    --success: #059669;
    --success-soft: rgba(5, 150, 105, 0.12);
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.1);
    --warning: #d97706;
    --shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
  }

  :root[data-theme="dark"] {
    --bg: #0b0d11;
    --surface: #14171f;
    --surface-sub: #1c202b;
    --border: #282e3d;
    --text: #f1f5f9;
    --text-muted: #8e98a8;
    --primary: #3b82f6;
    --primary-soft: rgba(59, 130, 246, 0.16);
    --success: #10b981;
    --success-soft: rgba(16, 185, 129, 0.15);
    --danger: #ef4444;
    --danger-soft: rgba(239, 68, 68, 0.15);
    --warning: #f59e0b;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  /* Hiệu ứng nhấn chung cho mọi nút: thu nhỏ + tối nhẹ lúc chạm, nhả ra mượt */
  button {
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.13s cubic-bezier(0.2, 0.7, 0.3, 1.1),
                filter 0.13s ease,
                background-color 0.15s ease,
                opacity 0.13s ease,
                box-shadow 0.2s ease;
  }

  button:active {
    transform: scale(0.93);
    filter: brightness(0.94);
  }

  /* Vuốt trái để xóa dòng */
  .swipe-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    background: var(--danger);
  }

  .swipe-del {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 78px;
    background: var(--danger);
    color: #fff;
    border: none;
    font-size: 13px;
    font-weight: 700;
  }

  .swipe-wrap > .item-row {
    position: relative;
    touch-action: pan-y;
    transition: transform 0.22s ease;
  }

  .swipe-wrap > .item-row.swiped {
    transform: translateX(-78px);
  }

  .sec-header-btns {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  body {
    margin: 0;
    padding: 14px 12px calc(115px + env(safe-area-inset-bottom)) 12px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
  }

  /* Header */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .app-title {
    font-size: 17px;
    font-weight: 700;
    margin: 0;
  }

  .top-actions {
    display: flex;
    gap: 6px;
  }

  .btn-small {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-small:active {
    transform: scale(0.97);
  }

  /* Nút avatar tròn ghim nổi ở góc trên-phải màn hình (điểm gắn chức năng sau này) */
  .avatar-btn {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    right: 12px;
    z-index: 940;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    padding: 0;
    border: 2px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
    background: var(--surface-sub);
    box-shadow: var(--shadow);
  }

  /* Chừa chỗ để nút trong top-bar không chui xuống dưới avatar */
  .top-bar {
    padding-right: 56px;
  }

  .avatar-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  /* Card chung */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }

  label.field-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    display: block;
    margin-bottom: 5px;
  }

  input, textarea, select {
    width: 100%;
    background: var(--surface-sub);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }

  input:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }

  /* Chuyển sáng/tối mượt trên các bề mặt chính */
  .card, .item-row, .tank-row, .saved-item, .bottom-dock, .preview-box,
  input, textarea, .step-group {
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  /* Khu vực chỉnh nhanh Ngày / Tháng / Năm */
  .date-section {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .date-main-row {
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  .date-display-input {
    font-weight: 700;
    text-align: center;
  }

  .date-quick-btns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .btn-date-quick {
    background: var(--surface-sub);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }

  .btn-date-quick.today-highlight {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: var(--primary);
  }

  /* Tiêu đề mỗi mục 1..5 */
  .sec-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .sec-title-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
  }

  .sec-title-input {
    display: none;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 8px;
    margin-bottom: 0;
  }

  /* Danh sách các dòng gạch đầu dòng */
  .item-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
  }

  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    background: var(--surface-sub);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 9px;
  }

  .item-bullet {
    color: var(--primary);
    font-weight: 700;
    padding-top: 1px;
    user-select: none;
  }

  .item-text {
    flex: 1;
    font-size: 14px;
    word-break: break-word;
    white-space: pre-wrap;
    outline: none;
  }

  .item-clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 7px;
    cursor: pointer;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .add-row {
    display: flex;
    gap: 6px;
  }

  .add-row input {
    flex: 1;
    margin-bottom: 0;
  }

  .btn-add {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
  }

  .btn-paste {
    background: var(--surface-sub);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Thẻ bấm nhanh (Quick Chips) */
  .chips-wrap {
    margin-top: 8px;
  }

  .chips-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
  }

  .chips-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .chips-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    background: var(--primary-soft);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.13s ease, opacity 0.13s ease, background-color 0.15s ease;
  }

  .chip:active {
    transform: scale(0.94);
    opacity: 0.75;
  }

  .chip-remove {
    color: var(--danger);
    font-weight: 700;
    font-size: 11px;
    display: inline-block;
    padding: 8px 6px;
    margin: -8px -6px -8px 0;
  }

  /* Mục 5: Bể mái & Nút tăng giảm 0.1 */
  .tank-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 8px;
  }

  .tank-row {
    display: grid;
    grid-template-columns: 0.8fr 1.45fr 1.45fr;
    gap: 6px;
    align-items: center;
    background: var(--surface-sub);
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .tank-row.single-input {
    grid-template-columns: 1fr 2fr;
  }

  .tank-name {
    font-size: 13px;
    font-weight: 700;
  }

  .tank-field {
    display: flex;
    align-items: center;
    gap: 3px;
    min-width: 0;
  }

  .tank-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    white-space: nowrap;
    min-width: 22px;
  }

  .step-group {
    display: flex;
    align-items: center;
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .step-btn {
    background: var(--surface-sub);
    color: var(--text);
    border: none;
    padding: 7px 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .step-btn:active {
    background: var(--primary-soft);
    color: var(--primary);
  }

  .step-input {
    width: 100%;
    min-width: 0;
    border: none !important;
    background: transparent !important;
    text-align: center;
    font-weight: 700;
    padding: 5px 2px !important;
    font-size: 13px;
    margin-bottom: 0 !important;
  }

  .tank-unit {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    padding-right: 3px;
  }

  /* Danh sách báo cáo đã lưu */
  .saved-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }

  .saved-item {
    background: var(--surface-sub);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .saved-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .saved-date {
    font-size: 14px;
    font-weight: 700;
  }

  .saved-meta {
    font-size: 11px;
    color: var(--text-muted);
  }

  .saved-actions {
    display: flex;
    gap: 6px;
  }

  /* Khung xem trước văn bản */
  .preview-box {
    background: var(--surface-sub);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    font-size: 13.5px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
  }

  /* Thanh ghim dưới đáy */
  .bottom-dock {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 12px calc(18px + env(safe-area-inset-bottom)) 12px;
    z-index: 900;
    box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.12);
  }

  .dock-inner {
    max-width: 680px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .btn-dock {
    border-radius: 10px;
    padding: 13px 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    border: 1px solid var(--border);
  }

  .btn-dock:active {
    transform: scale(0.98);
  }

  .btn-share {
    background: var(--surface-sub);
    color: var(--text);
  }

  .btn-save-report {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.35);
  }

  .btn-copy-all {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
    font-size: 14px;
    box-shadow: 0 3px 10px rgba(5, 150, 105, 0.35);
  }

  .toast {
    position: fixed;
    bottom: calc(96px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--text);
    color: var(--bg);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 999;
    max-width: 92vw;
    text-align: center;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .ver-tag {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    margin: 2px 0 10px;
    user-select: none;
  }

  .toast-btn {
    background: rgba(255, 255, 255, 0.16);
    color: inherit;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    pointer-events: auto;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h1 class="app-title">Báo Cáo Hàng Ngày – Tổ Nước</h1>
    <div class="top-actions">
      <button class="btn-small" onclick="loadSampleReport()">Nạp mẫu</button>
      <button class="btn-small" id="theme-btn" onclick="toggleTheme()">Giao diện: Sáng</button>
      
    </div>
  </div>

  <!-- Thông tin chung & Bộ chỉnh nhanh Ngày Tháng Năm -->
  <div class="card">
    <div>
      <label class="field-label">Tiêu đề báo cáo</label>
      <input type="text" id="report-header" value="BÁO CÁO CÔNG VIỆC – TỔ NƯỚC" oninput="autoSaveDraft()">
    </div>

    <div class="date-section">
      <label class="field-label">Ngày báo cáo (Chạm lịch hoặc bấm nút chỉnh nhanh)</label>
      <div class="date-main-row">
        <input type="text" class="date-display-input" id="report-date" placeholder="DD/MM/YYYY" inputmode="numeric" autocomplete="off" oninput="onManualDateInput(this.value)">
        <input type="date" id="native-date-picker" onchange="onNativeDatePicked(this.value)">
      </div>
      <div class="date-quick-btns">
        <button class="btn-date-quick" onclick="shiftReportDate(-1)">-1 Ngày</button>
        <button class="btn-date-quick today-highlight" onclick="setReportDateToday()">Hôm nay</button>
        <button class="btn-date-quick" onclick="shiftReportDate(1)">+1 Ngày</button>
      </div>
    </div>
  </div>

  <!-- Danh sách các mục 1 -> 4 -->
  <div id="sections-container"></div>

  <!-- Mục 5: Theo dõi mực nước bể mái (Có nút tăng giảm 0.1) -->
  <div class="card">
    <div class="sec-header">
      <span class="sec-title-text" id="sec5-title-display">5. Theo dõi mực nước bể mái</span>
      <input type="text" class="sec-title-input" id="sec5-title-input" oninput="updateSec5Title(this.value)">
      <div class="sec-header-btns">
        <button class="btn-small" onclick="copySec5()">Copy</button>
        <button class="btn-small" onclick="toggleEditSec5Title()">Sửa tiêu đề</button>
      </div>
    </div>

    <div class="tank-grid">
      <!-- Khu Z1 -->
      <div class="tank-row">
        <span class="tank-name">Khu Z1</span>
        <div class="tank-field">
          <span class="tank-label">RO</span>
          <div class="step-group">
            <button class="step-btn" aria-label="Giảm 0,1 mét" onclick="adjustTank('z1-ro', -0.1)">-</button>
            <input type="text" inputmode="decimal" id="z1-ro" class="step-input" placeholder="1,8" oninput="autoSaveDraft()">
            <button class="step-btn" aria-label="Tăng 0,1 mét" onclick="adjustTank('z1-ro', 0.1)">+</button>
          </div>
          <span class="tank-unit">m</span>
        </div>
        <div class="tank-field">
          <span class="tank-label">SH</span>
          <div class="step-group">
            <button class="step-btn" aria-label="Giảm 0,1 mét" onclick="adjustTank('z1-sh', -0.1)">-</button>
            <input type="text" inputmode="decimal" id="z1-sh" class="step-input" placeholder="1,7" oninput="autoSaveDraft()">
            <button class="step-btn" aria-label="Tăng 0,1 mét" onclick="adjustTank('z1-sh', 0.1)">+</button>
          </div>
          <span class="tank-unit">m</span>
        </div>
      </div>

      <!-- Khu Z3 -->
      <div class="tank-row">
        <span class="tank-name">Khu Z3</span>
        <div class="tank-field">
          <span class="tank-label">RO</span>
          <div class="step-group">
            <button class="step-btn" aria-label="Giảm 0,1 mét" onclick="adjustTank('z3-ro', -0.1)">-</button>
            <input type="text" inputmode="decimal" id="z3-ro" class="step-input" placeholder="1,6" oninput="autoSaveDraft()">
            <button class="step-btn" aria-label="Tăng 0,1 mét" onclick="adjustTank('z3-ro', 0.1)">+</button>
          </div>
          <span class="tank-unit">m</span>
        </div>
        <div class="tank-field">
          <span class="tank-label">SH</span>
          <div class="step-group">
            <button class="step-btn" aria-label="Giảm 0,1 mét" onclick="adjustTank('z3-sh', -0.1)">-</button>
            <input type="text" inputmode="decimal" id="z3-sh" class="step-input" placeholder="1,7" oninput="autoSaveDraft()">
            <button class="step-btn" aria-label="Tăng 0,1 mét" onclick="adjustTank('z3-sh', 0.1)">+</button>
          </div>
          <span class="tank-unit">m</span>
        </div>
      </div>

      <!-- Khu A1 + A2 -->
      <div class="tank-row single-input">
        <span class="tank-name">Khu A1+A2</span>
        <div class="tank-field" style="width:100%;">
          <span class="tank-label">Mực nước</span>
          <div class="step-group">
            <button class="step-btn" aria-label="Giảm 0,1 mét" onclick="adjustTank('a12-level', -0.1)">-</button>
            <input type="text" inputmode="decimal" id="a12-level" class="step-input" placeholder="2,1" oninput="autoSaveDraft()">
            <button class="step-btn" aria-label="Tăng 0,1 mét" onclick="adjustTank('a12-level', 0.1)">+</button>
          </div>
          <span class="tank-unit">m</span>
        </div>
      </div>
    </div>

    <div class="item-list" id="sec5-extra-list"></div>
    <div class="add-row">
      <input type="text" id="sec5-extra-input" placeholder="Thêm ghi chú bể mái khác (nếu có)..." onkeydown="if(event.key==='Enter') addSec5Extra()">
      <button class="btn-paste" onclick="pasteInto('sec5-extra-input')">📋 Dán</button>
      <button class="btn-add" onclick="addSec5Extra()">+ Thêm</button>
    </div>
  </div>

  <!-- Lịch sử Báo cáo đã lưu -->

/* Hàm tăng giảm 0.1 cho các ô mực nước (hỗ trợ dấu phẩy hoặc chấm thập phân) */
function adjustTank(inputId, delta) {
  const input = document.getElementById(inputId);
  if (!input) return;
  let valStr = input.value.trim().replace(",", ".");
  let num = parseFloat(valStr);
  if (isNaN(num)) {
    num = delta > 0 ? 1.0 : 0.0;
  } else {
    num = Math.round((num + delta) * 10) / 10;
    if (num < 0) num = 0;
  }
  // Chuyển lại về định dạng dấu phẩy tiếng Việt cho chuẩn mẫu
  input.value = num.toFixed(1).replace(".", ",");
  autoSaveDraft();
}

/* Xử lý Ngày / Tháng / Năm */
function formatDateToVN(dateObj) {
  const dd = String(dateObj.getDate()).padStart(2, "0");
  const mm = String(dateObj.getMonth() + 1).padStart(2, "0");
  const yyyy = dateObj.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function formatDateToISO(dateObj) {
  const dd = String(dateObj.getDate()).padStart(2, "0");
  const mm = String(dateObj.getMonth() + 1).padStart(2, "0");
  const yyyy = dateObj.getFullYear();
  return `${yyyy}-${mm}-${dd}`;
}

function tryParseVNDate(vnStr) {
  const m = String(vnStr || "").trim().match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if (!m) return null;
  const dd = Number(m[1]), mm = Number(m[2]), yyyy = Number(m[3]);
  const d = new Date(yyyy, mm - 1, dd);
  if (isNaN(d.getTime())) return null;
  if (d.getDate() !== dd || d.getMonth() !== mm - 1 || d.getFullYear() !== yyyy) return null;
  return d;
}

/* Ngày báo cáo đang dùng: ưu tiên ô nhập tay, rồi ngày đã lưu, cuối cùng là hôm nay */

}

let toastTimer = null;
let toastActionFn = null;

function setToast(msg, actionLabel, duration) {
  const t = document.getElementById("toast");
  document.getElementById("toast-text").textContent = msg;
  const btn = document.getElementById("toast-btn");
  if (actionLabel) {
    btn.textContent = actionLabel;
    btn.style.display = "";
  } else {
    btn.style.display = "none";
  }
  t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, duration);
}

function hideToast() {
  document.getElementById("toast").classList.remove("show");
  toastTimer = null;
  toastActionFn = null;
  pendingUndo = null;
}

function showToast(msg, duration = 2000) {
  toastActionFn = null;
  setToast(msg, null, duration);
}

function showToastWithAction(msg, actionLabel, fn, duration = 4000) {
  toastActionFn = fn || null;
  setToast(msg, actionLabel, duration);
}

document.getElementById("toast-btn").addEventListener("click", () => {

  toastActionFn = null;
  if (toastTimer) clearTimeout(toastTimer);
  document.getElementById("toast").classList.remove("show");

  if (fn) fn();
});

    id: Date.now(),
    date: reportDate,
    savedAt: `Lưu lúc ${savedAt}`,
    text: buildReportText(),
    snapshot: snapshot
  };

  if (existingIdx >= 0) {
    savedHistory[existingIdx] = record;
  } else {
    savedHistory.unshift(record);
  }

  localStorage.setItem(SAVED_HISTORY_KEY, JSON.stringify(savedHistory));
  renderSavedHistory();
  showToast(`Đã lưu báo cáo ngày ${reportDate}`);
}

function renderSavedHistory() {
  const container = document.getElementById("saved-reports-container");
  document.getElementById("saved-count").textContent = savedHistory.length;

  if (savedHistory.length === 0) {
    container.innerHTML = `<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:10px;">Chưa có bản lưu nào. Bấm nút "Lưu báo cáo" ở dưới đáy để lưu lại theo ngày.</div>`;
    return;
  }

  container.innerHTML = savedHistory.map((item, idx) => `
    <div class="saved-item">
      <div class="saved-info">
        <span class="saved-date">Ngày: ${escapeHtml(item.date)}</span>
        <span class="saved-meta">${escapeHtml(item.savedAt)}</span>
      </div>
      <div class="saved-actions">
        <button class="btn-small" onclick="loadSavedReport(${idx})">Mở lại</button>
        <button class="btn-small" onclick="copySavedReport(${idx})">Copy</button>
        <button class="btn-small" style="color:var(--danger)" onclick="deleteSavedReport(${idx})">Xóa</button>
      </div>
    </div>
  `).join("");
}

function loadSavedReport(idx) {
  const item = savedHistory[idx];
  if (!item || !item.snapshot) return;
  state = JSON.parse(JSON.stringify(item.snapshot));
  syncInputsFromState();
  autoSaveDraft();
  renderSections();
  renderSec5Extra();
  showToast(`Đã mở lại báo cáo ngày ${item.date}`);
}

async function copySavedReport(idx) {
  const item = savedHistory[idx];
  if (!item) return;
  await copyTextToClipboard(item.text);
  showToast(`Đã sao chép báo cáo ngày ${item.date}`);
}

function deleteSavedReport(idx) {
  if (!confirm(`Xóa bản lưu báo cáo ngày ${savedHistory[idx].date}?`)) return;
  savedHistory.splice(idx, 1);
  localStorage.setItem(SAVED_HISTORY_KEY, JSON.stringify(savedHistory));
  renderSavedHistory();
  showToast("Đã xóa bản lưu");
}

function downloadCurrentReportTxt() {
  saveReportExplicit();
  const content = buildReportText();
  const safeDate = (state.date || todayStr()).replace(/[^0-9a-zA-Z_-]/g, "-");
  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `BaoCao_ToNuoc_${safeDate}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

/* Render các mục 1 -> 4 */
function renderSections() {
  const container = document.getElementById("sections-container");
  container.innerHTML = state.sections.map((sec, sIdx) => {
    const isEditingPresets = !!editingPresetMode[sec.id];
    const itemsHtml = sec.items.map((item, iIdx) => `
      <div class="swipe-wrap">
        <button class="swipe-del" onclick="deleteItemWithUndo(${sIdx}, ${iIdx})">Xóa dòng</button>
        <div class="item-row" data-sidx="${sIdx}" data-iidx="${iIdx}">
          <span class="item-bullet">-</span>
          <div class="item-text" contenteditable="true" onblur="editItemText(${sIdx}, ${iIdx}, this.innerText)">${escapeHtml(item)}</div>
          <button class="item-clear" onclick="clearItemContent(${sIdx}, ${iIdx})">Xóa ND</button>
        </div>
      </div>
    `).join("");

    const chipsHtml = (sec.presets || []).map((preset, pIdx) => `
      <span class="chip" onclick="handleChipClick(${sIdx}, ${pIdx})">
        <span>+ ${escapeHtml(preset)}</span>
        ${isEditingPresets ? `<span class="chip-remove" onclick="event.stopPropagation(); removePreset(${sIdx},${pIdx})">✕</span>` : ""}
      </span>
    `).join("");

    return `
      <div class="card">
        <div class="sec-header">
          <span class="sec-title-text" id="title-disp-${sIdx}">${escapeHtml(sec.title)}</span>
          <input type="text" class="sec-title-input" id="title-inp-${sIdx}" value="${escapeHtml(sec.title)}" oninput="updateSectionTitle(${sIdx}, this.value)">
          <div class="sec-header-btns">
            <button class="btn-small" onclick="copySection(${sIdx})">Copy</button>
            <button class="btn-small" onclick="toggleEditSectionTitle(${sIdx})">Sửa mục</button>
          </div>
        </div>

        <div class="item-list">${itemsHtml}</div>

        <div class="add-row">
          <input type="text" id="add-inp-${sIdx}" placeholder="Nhập công việc mới vào mục ${sIdx + 1}..." onkeydown="if(event.key==='Enter') addItem(${sIdx})">
          <button class="btn-paste" onclick="pasteInto('add-inp-${sIdx}')">📋 Dán</button>
          <button class="btn-add" onclick="addItem(${sIdx})">+ Thêm</button>
        </div>

        <div class="chips-wrap">
          <div class="chips-header">
            <span class="chips-label">Chạm để chèn nhanh việc thường làm:</span>
            <button class="btn-small" style="padding:3px 7px;font-size:11px;" onclick="togglePresetManage(${sIdx})">
              ${isEditingPresets ? "Xong" : "Sửa mẫu"}
            </button>
          </div>
          <div class="chips-list">${chipsHtml}</div>
          ${isEditingPresets ? `
            <div class="add-row" style="margin-top:6px;">
              <input type="text" id="preset-inp-${sIdx}" placeholder="Thêm câu mẫu lặp lại hàng ngày..." onkeydown="if(event.key==='Enter') addPreset(${sIdx})">
              <button class="btn-add" onclick="addPreset(${sIdx})">Lưu mẫu</button>
            </div>
          ` : ""}
        </div>
      </div>
    `;
  }).join("");
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function toggleEditSectionTitle(sIdx) {
  const disp = document.getElementById(`title-disp-${sIdx}`);
  const inp = document.getElementById(`title-inp-${sIdx}`);
  const isHidden = inp.style.display === "none" || !inp.style.display;
  inp.style.display = isHidden ? "block" : "none";
  disp.style.display = isHidden ? "none" : "block";
  if (isHidden) inp.focus();
}

function updateSectionTitle(sIdx, val) {
  state.sections[sIdx].title = val;
  document.getElementById(`title-disp-${sIdx}`).textContent = val;
  autoSaveDraft();
}

async function pasteInto(inputId) {
  const input = document.getElementById(inputId);
  if (!input) return;
  try {
    const text = await navigator.clipboard.readText();
    if (text) {
      input.value = text;
      input.focus();
      showToast("Đã dán");
    } else {
      input.focus();
      showToast("Clipboard đang trống");
    }
  } catch (_) {
    /* iOS chưa cấp quyền đọc clipboard: hướng dẫn dán thủ công */
    input.focus();
    showToast("Chưa đọc được clipboard — bấm giữ ô nhập rồi chọn Dán");
  }
}

function addItem(sIdx) {
  const inp = document.getElementById(`add-inp-${sIdx}`);
  const val = inp.value.trim().replace(/^-\s*/, "");
  if (!val) return;
  state.sections[sIdx].items.push(val);
  inp.value = "";
  autoSaveDraft();
  renderSections();
  const newInp = document.getElementById(`add-inp-${sIdx}`);
  if (newInp) newInp.focus({ preventScroll: true });
}

function editItemText(sIdx, iIdx, newText) {
  const cleaned = newText.trim().replace(/^-\s*/, "");
  if (!cleaned) {
    state.sections[sIdx].items.splice(iIdx, 1);
    autoSaveDraft();
    renderSections();
  } else if (cleaned !== state.sections[sIdx].items[iIdx]) {
    /* Chỉ lưu state + cập nhật xem trước, không render lại để nút đang bấm không bị "bay mất" */
    state.sections[sIdx].items[iIdx] = cleaned;
    autoSaveDraft();
  }
}

/* Xóa hẳn dòng + hoàn tác */
let pendingUndo = null;

function deleteItemWithUndo(sIdx, iIdx) {
  const arr = state.sections[sIdx] && state.sections[sIdx].items;
  if (!arr || iIdx < 0 || iIdx >= arr.length) return;
  const item = arr[iIdx];
  arr.splice(iIdx, 1);
  autoSaveDraft();
  renderSections();
  pendingUndo = { kind: "item", sIdx, iIdx, item };
  showToastWithAction("Đã xóa dòng", "Hoàn tác", undoDelete);
}

function deleteSec5ExtraWithUndo(idx) {
  const arr = state.sec5Extra || [];
  if (idx < 0 || idx >= arr.length) return;
  const item = arr[idx];
  arr.splice(idx, 1);
  autoSaveDraft();
  renderSec5Extra();
  pendingUndo = { kind: "sec5extra", idx, item };
  showToastWithAction("Đã xóa dòng", "Hoàn tác", undoDelete);
}

function undoDelete() {
  if (!pendingUndo) return;
  const u = pendingUndo;
  pendingUndo = null;
  if (u.kind === "item" && state.sections[u.sIdx]) {
    const arr = state.sections[u.sIdx].items;
    arr.splice(Math.min(u.iIdx, arr.length), 0, u.item);
    autoSaveDraft();
    renderSections();
  } else if (u.kind === "sec5extra") {
    const arr = state.sec5Extra;
    arr.splice(Math.min(u.idx, arr.length), 0, u.item);
    autoSaveDraft();
    renderSec5Extra();
  }
  showToast("Đã hoàn tác");
}

function handleChipClick(sIdx, pIdx) {
  const text = state.sections[sIdx].presets[pIdx];
  if (!state.sections[sIdx].items.includes(text)) {
    state.sections[sIdx].items.push(text);
    autoSaveDraft();
    renderSections();
    showToast("Đã thêm vào danh sách");
  } else {
    showToast("Nội dung này đã có trong mục");
  }
}

function togglePresetManage(sIdx) {
  const secId = state.sections[sIdx].id;
  editingPresetMode[secId] = !editingPresetMode[secId];
  renderSections();
}

function addPreset(sIdx) {

/* Dựng text cho từng mục riêng lẻ */
function buildSectionText(sec) {
  const lines = [sec.title];
  if (sec.items.length === 0) {
    lines.push("- Không phát sinh.");
  } else {
    for (const item of sec.items) {
      lines.push(`- ${item}`);
    }
  }
  return lines.join("\n");
}

function buildSec5Text() {
  const lines = [state.sec5Title || "5. Theo dõi mực nước bể mái"];
  const t = state.tanks || {};
  if (t.z1_ro || t.z1_sh) {
    lines.push(`- Khu Z1: RO ${t.z1_ro || "..."} m – SH ${t.z1_sh || "..."} m`);
  }
  if (t.z3_ro || t.z3_sh) {
    lines.push(`- Khu Z3: RO ${t.z3_ro || "..."} m – SH ${t.z3_sh || "..."} m`);
  }
  if (t.a12) {
    lines.push(`- Khu A1 + A2: ${t.a12} m`);
  }
  for (const ex of state.sec5Extra || []) {
    lines.push(`- ${ex}`);
  }
  return lines.join("\n");
}

/* Tạo chuỗi Báo cáo hoàn chỉnh */
function buildReportText() {
  const lines = [];
  lines.push(state.header || "BÁO CÁO CÔNG VIỆC – TỔ NƯỚC");
  lines.push("");
  lines.push(`Ngày: ${state.date || todayStr()}`);
  lines.push("");

  for (const sec of state.sections) {
    lines.push(buildSectionText(sec));
    lines.push("");
  }

  lines.push(buildSec5Text());

  return lines.join("\n").trim();
}

async function copyTextToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch (_) {}
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
}

async function copyFullReport() {

/* Vuốt trái trên dòng để hiện nút Xóa (mobile) */
let swipeTrack = null;
let swallowNextClick = false;
const SWIPE_REVEAL = 78;
const SWIPE_SNAP = 40;
const SWIPE_FULL = 120;

function findSwipeRow(el) {
  return el && el.closest ? el.closest(".swipe-wrap > .item-row") : null;
}

document.addEventListener("touchstart", (e) => {
  const onDelBtn = e.target.closest ? e.target.closest(".swipe-del") : null;
  const onRowBtn = e.target.closest ? e.target.closest(".item-clear") : null;
  let row = findSwipeRow(e.target);
  if (onDelBtn && !row) {
    /* Bấm nút Xóa đỏ: nút nằm sau hàng (không phải con của .item-row)
       nên phải tìm hàng cùng wrap, nếu không hàng sẽ tự đóng trước khi click kịp chạy */
    const wrap = onDelBtn.closest(".swipe-wrap");
    row = wrap ? wrap.querySelector(".item-row") : null;
  }

  document.querySelectorAll(".item-row.swiped").forEach((r) => {
    if (r !== row) {
      r.classList.remove("swiped");
      r.style.transform = "";
    }
  });

  if (row && row.classList.contains("swiped") && !onDelBtn && !onRowBtn) {
    row.classList.remove("swiped");
    row.style.transform = "";
    swallowNextClick = true;
    swipeTrack = null;
    return;
  }

  if (!row || row.classList.contains("swiped") || onDelBtn || onRowBtn) {
    swipeTrack = null;
    return;
  }

  const ae = document.activeElement;
  if (ae && ae.isContentEditable && row.contains(ae)) {
    swipeTrack = null;
    return;
  }

  const t = e.touches[0];
  swipeTrack = { row, startX: t.clientX, startY: t.clientY, dx: 0, active: false };
}, { passive: true });

document.addEventListener("touchmove", (e) => {
  if (!swipeTrack) return;
  const t = e.touches[0];
  const dx = t.clientX - swipeTrack.startX;
  const dy = t.clientY - swipeTrack.startY;

  if (!swipeTrack.active) {
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      swipeTrack.active = true;
      swipeTrack.row.style.transition = "none";
    } else if (Math.abs(dy) > 12) {
      swipeTrack = null;
      return;
    } else {
      return;
    }
  }

  if (dx < 0) {
    e.preventDefault();
    const x = Math.max(dx, -170);
    swipeTrack.row.style.transform = `translateX(${x}px)`;
    swipeTrack.dx = x;
  } else {
    swipeTrack.row.style.transform = "";
    swipeTrack.dx = 0;
  }
}, { passive: false });

document.addEventListener("touchend", (e) => {
  if (!swipeTrack) return;
  const { row, startX, startY, dx: trackedDx } = swipeTrack;
  swipeTrack = null;

  /* Tính độ vuốt từ điểm chạm cuối — đáng tin cậy trên iOS kể cả khi
     touchmove không kịp chạy (vuốt nhanh/flick) */
  let dx = trackedDx, dy = 0;
  const t = e.changedTouches && e.changedTouches[0];
  if (t) {
    dx = t.clientX - startX;
    dy = t.clientY - startY;
  }
  const horizontal = Math.abs(dx) > Math.abs(dy);

  if (horizontal && dx <= -SWIPE_FULL) {
    /* Vuốt xa: xóa hẳn dòng (có nút Hoàn tác) */
    const ds = row.dataset || {};
    const isSec5 = ds.eidx !== undefined && ds.eidx !== "";
    const sIdx = Number(ds.sidx), iIdx = Number(ds.iidx), eIdx = Number(ds.eidx);
    if (isSec5 ? isNaN(eIdx) : (isNaN(sIdx) || isNaN(iIdx))) return;
    row.style.transition = "transform 0.25s ease, opacity 0.25s ease";
    row.style.transform = "translateX(-110%)";
    row.style.opacity = "0";
    setTimeout(() => {
      if (isSec5) deleteSec5ExtraWithUndo(eIdx);
      else deleteItemWithUndo(sIdx, iIdx);
    }, 240);
    return;
  }
  row.style.transition = "";
  row.style.transform = "";
  if (horizontal && dx <= -SWIPE_SNAP) {
    row.classList.add("swiped");
  } else {
    row.classList.remove("swiped");
  }
}, { passive: true });

document.addEventListener("touchcancel", () => {
  if (!swipeTrack) return;
  swipeTrack.row.style.transition = "";
  swipeTrack.row.style.transform = "";
  swipeTrack = null;
}, { passive: true });

document.addEventListener("click", (e) => {
  if (swallowNextClick) {
    swallowNextClick = false;
    e.stopPropagation();
    e.preventDefault();
  }
}, true);

loadState();
